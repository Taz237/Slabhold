<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Slabhold</title>
    <!--
      Shown inside the iOS app when https://slabhold.app can't load (server.errorPath).
      Bundled in the app, so no network fonts or scripts.
    -->
    <style>
      :root {
        --bg: #f4f4f5;
        --ink: #18181b;
        --muted: #52525b;
        --line: rgba(24, 24, 27, 0.08);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #09090b;
          --ink: #f4f4f5;
          --muted: #a1a1aa;
          --line: rgba(244, 244, 245, 0.08);
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: Geist, -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        -webkit-text-size-adjust: 100%;
      }
      main {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        text-align: center;
      }
      svg {
        width: 64px;
        height: 64px;
        display: block;
      }
      .copy {
        display: grid;
        gap: 8px;
        max-width: 280px;
      }
      h1 {
        margin: 0;
        font-size: 20px;
        line-height: 28px;
        font-weight: 600;
      }
      p {
        margin: 0;
        font-size: 15px;
        line-height: 22px;
        color: var(--muted);
      }
      button {
        min-height: 44px;
        min-width: 160px;
        padding: 0 24px;
        border: 0;
        border-radius: 999px;
        background: #7c3aed;
        color: #fff;
        font: inherit;
        font-size: 15px;
        font-weight: 600;
        transition: transform 120ms cubic-bezier(0.2, 0.7, 0.2, 1), background-color 120ms;
        -webkit-tap-highlight-color: transparent;
      }
      button:active {
        transform: scale(0.97);
        background: #6d28d9;
      }
      button:focus-visible {
        outline: 2px solid #a78bfa;
        outline-offset: 3px;
      }
      @media (prefers-reduced-motion: reduce) {
        button {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="#7C3AED" />
        <rect x="9" y="3.5" width="14" height="25" rx="2.25" fill="#fff" />
        <rect x="11.15" y="5.75" width="9.7" height="3.5" rx="0.85" fill="#5B21B6" />
        <path
          fill="#5B21B6"
          d="M16 14.5 17.09 17.55 20.33 17.64 17.76 19.62 18.67 22.73 16 20.9 13.33 22.73 14.24 19.62 11.67 17.64 14.91 17.55Z"
        />
      </svg>
      <div class="copy">
        <h1>Can't reach Slabhold</h1>
        <p>Check your connection, then try again. Your collection is safe.</p>
      </div>
      <button type="button" id="retry">Try again</button>
    </main>
    <script>
      (function () {
        var plugins = (window.Capacitor && window.Capacitor.Plugins) || {};
        try {
          if (plugins.SplashScreen) plugins.SplashScreen.hide();
        } catch (e) {}
        document.getElementById("retry").addEventListener("click", function () {
          window.location.replace("https://slabhold.app/");
        });
      })();
    </script>
  </body>
</html>

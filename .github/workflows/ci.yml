name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: |
          # psql is preinstalled on ubuntu runners; fall back to the service container's own client.
          if command -v psql >/dev/null; then
            psql "postgres://postgres@127.0.0.1:5433/postgres" -v ON_ERROR_STOP=1 -c "create database likes_test"
          else
            docker exec ${{ job.services.postgres.id }} psql -U postgres -v ON_ERROR_STOP=1 -c "create database likes_test"
          fi
          npm test
        env:
          DEAL_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5433/postgres
          LIKES_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5433/likes_test?sslmode=disable

      - name: Lint
        run: npm run lint:ci

      - name: Build
        run: npm run build

      - name: Bundle size
        run: npm run bundle:check

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"><defs>
<filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
  <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000" flood-opacity=".55"/></filter>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
<filter id="soft6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="soft3" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
<filter id="grain" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" result="n"/>
  <feColorMatrix type="saturate" values="0"/>
  <feComponentTransfer><feFuncA type="table" tableValues="0 .22"/></feComponentTransfer>
  <feComposite in2="SourceGraphic" operator="in"/></filter>
<filter id="iconsh" x="-20%" y="-20%" width="140%" height="150%">
  <feDropShadow dx="0" dy="2.2" stdDeviation="1.6" flood-color="#000" flood-opacity=".6"/></filter>
<linearGradient id="iv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D9D6E3"/></linearGradient>
<linearGradient id="ac" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C4B1FF"/><stop offset="1" stop-color="#7C3AED"/></linearGradient>
<filter id="silo" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
  <feComponentTransfer in="SourceAlpha" result="a"><feFuncA type="discrete" tableValues="0 0 1 1 1 1"/></feComponentTransfer>
  <feMorphology in="a" operator="dilate" radius="3" result="big"/>
  <feFlood flood-color="#2E2E33"/><feComposite in2="big" operator="in" result="rim"/>
  <feFlood flood-color="#17171A"/><feComposite in2="a" operator="in" result="fill"/>
  <feMerge><feMergeNode in="rim"/><feMergeNode in="fill"/></feMerge></filter>
<filter id="siloicon" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
  <feComponentTransfer in="SourceAlpha" result="a"><feFuncA type="discrete" tableValues="0 1 1 1"/></feComponentTransfer>
  <feFlood flood-color="#3F3F46"/><feComposite in2="a" operator="in"/></filter>
</defs><g filter="url(#silo)">
<linearGradient id="bz" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A8703F"/><stop offset="1" stop-color="#7A4A27"/></linearGradient>
<linearGradient id="bzr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D49A6A"/><stop offset="1" stop-color="#7A4A27"/></linearGradient>
<g filter="url(#drop)">
  <circle cx="256" cy="256" r="160" fill="#4E2D16"/>
  <circle cx="256" cy="256" r="157" fill="url(#bzr)"/>
  <circle cx="256" cy="256" r="140" fill="url(#bz)"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#4E2D16" stroke-width="2.4" stroke-opacity=".8"/>
  <circle cx="256" cy="256" r="160" fill="#fff" filter="url(#grain)"/>
</g>
<linearGradient id="lip" x1="0" y1="0" x2=".6" y2="1"><stop offset="0" stop-color="#4E2D16"/><stop offset="1" stop-color="#D49A6A"/></linearGradient><circle cx="256" cy="256" r="108.0" fill="none" stroke="url(#lip)" stroke-width="8"/>
<radialGradient id="enamel" cx="50%" cy="38%" r="70%"><stop offset="0" stop-color="#1B1626"/><stop offset="1" stop-color="#08070C"/></radialGradient>
<circle cx="256" cy="256" r="104" fill="url(#enamel)"/>

</g><circle cx="256" cy="256" r="104" fill="#0C0C0E"/></svg>
<linearGradient id="ac" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C4B1FF"/><stop offset="1" stop-color="#7C3AED"/></linearGradient></defs><g filter="url(#iconsh)" transform="translate(51,51) scale(4.1)">
<rect x="30" y="38" width="40" height="52" rx="6" fill="url(#iv)"/>
<rect x="35.5" y="50" width="29" height="34.5" rx="3.2" fill="#1A1328"/>
<rect x="35.5" y="43" width="29" height="4.2" rx="1.6" fill="url(#ac)"/>
<rect x="42.5" y="55" width="15" height="24" rx="2.2" fill="url(#iv)"/><rect x="45" y="58" width="10" height="3.4" rx="1.2" fill="url(#ac)"/>
<path d="M27,40 L24,18 L38,29 L50,12 L62,29 L76,18 L73,40 Z" fill="url(#ac)" stroke="url(#ac)" stroke-width="3" stroke-linejoin="round"/>
<circle cx="24" cy="17" r="3.6" fill="url(#iv)"/><circle cx="50" cy="11" r="3.8" fill="url(#iv)"/><circle cx="76" cy="17" r="3.6" fill="url(#iv)"/>

<linearGradient id="ac" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C4B1FF"/><stop offset="1" stop-color="#7C3AED"/></linearGradient></defs><g filter="url(#iconsh)" transform="translate(51,51) scale(4.1)">
<g transform="rotate(-13 50 60)"><rect x="20" y="22" width="38" height="62" rx="5.5" fill="url(#ac)"/></g>
<rect x="34" y="12" width="40" height="76" rx="6" fill="url(#iv)"/>
<rect x="39.5" y="17.5" width="29" height="11" rx="2.6" fill="url(#ac)"/>
<rect x="39.5" y="33" width="29" height="49.5" rx="3.2" fill="#1A1328"/>
<circle cx="61" cy="43" r="4.2" fill="url(#iv)"/>
<path d="M42.5,79 L51,62 L56.5,71 L60,66 L66,79 Z" fill="url(#iv)" stroke="url(#iv)" stroke-width="1.5" stroke-linejoin="round"/>
